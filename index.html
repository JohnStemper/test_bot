<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bot test</title>

    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <!-- VKUI -->
    <link rel="stylesheet" href="https://unpkg.com/@vkontakte/vkui@4.12.0/dist/vkui.css" />
    <script src="https://unpkg.com/@vkontakte/vkui@4.12.0/dist/vkui.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const bridge = window.VKBridge;

      // ВАЖНО: это домен твоего проекта на Bothost (без порта)
      const BOTHOST_URL = "https://bot-1793381514-7317-avgust-stemper.bothost.tech";
      const API_URL = `${BOTHOST_URL}/api/user?user_id=`;

      async function init() {
        await bridge.send("VKWebAppInit");
        const user = await bridge.send("VKWebAppGetUserInfo");
        const userId = user.id;

        const root = document.getElementById("root");

        const view = new vkui.View();
        const panel = new vkui.Panel();
        const layout = new vkui.Layout();
        const header = new vkui.Header("Профиль сталкера");

        // Элементы статистики
        const balanceText = new vkui.Text("Загрузка...", { size: "large" });
        const balanceBlock = new vkui.Card({
          children: [
            new vkui.Text("Баланс", { weight: "bold" }),
            balanceText
          ],
        });

        const levelText = new vkui.Text("1", { size: "large" });
        const levelBlock = new vkui.Card({
          children: [
            new vkui.Text("Уровень", { weight: "bold" }),
            levelText
          ],
        });

        async function updateData() {
          try {
            const res = await fetch(API_URL + userId);

            if (!res.ok) {
              throw new Error(`Ошибка HTTP: ${res.status}`);
            }

            const json = await res.json();

            // Обновляем баланс (если нет — ставим 0)
            const balance = Number(json.balance) || 0;
            balanceText.text = `${balance} монет`;

            // Обновляем уровень (если нет — оставляем 1)
            const level = Number(json.level) || 1;
            levelText.text = String(level);

            console.log("Данные обновлены:", json);
          } catch (e) {
            console.error(e);
            // В реальном проекте лучше использовать VK Bridge для красивого алерта
            alert("Не удалось загрузить данные. Проверьте консоль браузера (F12).");
          }
        }

        const refreshBtn = new vkui.Button("Обновить баланс", {
          mode: "primary",
          onClick: updateData
        });

        const statsGroup = new vkui.Group("stats", {
          header: new vkui.Text("Статистика")
        }, [balanceBlock, levelBlock]);

        layout.children = [statsGroup, refreshBtn];
        panel.children = [header, layout];
        view.children = panel;

        root.appendChild(view.render());

        updateData();
      }

      init();
    </script>
  </body>
</html>
