<!DOCTYPE html>
<html>
<head>
<title>VK OAuth Callback</title>
<script>
  // Весь код здесь для получения access_token из URL
  window.onload = function() {
    var hashParams = new URLSearchParams(window.location.hash.substring(1));
    var accessToken = hashParams.get('access_token');
    if (accessToken) {
      alert("Ваш access_token: " + accessToken);
    } else {
      alert("Access token не получен");
    }
  };
</script>
</head>
<body>
</body>
</html>
